name: Restls TLS hook
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test -p rustls --test restls_record_auth
      - run: cargo clippy -p rustls --lib --test restls_record_auth --features ring -- -D warnings
